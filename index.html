<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISTSHOP - Гемы Brawl Stars</title>
    
    <link rel="canonical" href="https://bobki2926-design.github.io/mistshopsite/">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1e2e; /* Фирменный темно-синий фон */
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%; /* Лого будет круглым */
            object-fit: cover;
            border: 3px solid #00d2ff; /* Голубая обводка */
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); /* Свечение */
        }
        .shop-title {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .shop-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.05); /* Затемнение фона карточки */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info { text-align: left; }
        .item-name { font-size: 18px; font-weight: bold; display: block; }
        .item-sub { font-size: 12px; color: rgba(255, 255, 255, 0.5); }
        .price {
            color: #00ff88; /* Ярко-зеленый цвет цены */
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }
        .buy-btn {
            background-color: #00d2ff; /* Голубая кнопка */
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:active {
            background-color: #00b8e6; /* Эффект при нажатии */
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://raw.githubusercontent.com/bobki2926-design/mistshopsite/main/1000009543.png" alt="MISTSHOP Logo" class="logo">
        <div class="shop-title">MISTSHOP</div>
        <div class="shop-subtitle">MISTS</div>
    </div>

    <div class="item-card">
        <div class="item-info">
            <span class="item-name">30 Гемов</span>
            <span class="item-sub">Brawl Stars</span>
        </div>
        <div style="display: flex; align-items: center;">
            <span class="price">199₽</span>
            <button class="buy-btn" onclick="sendData('30 Гемов')">Купить</button>
        </div>
    </div>

    <div class="item-card">
        <div class="item-info">
            <span class="item-name">170 Гемов</span>
            <span class="item-sub">Brawl Stars</span>
        </div>
        <div style="display: flex; align-items: center;">
            <span class="price">990₽</span>
            <button class="buy-btn" onclick="sendData('170 Гемов')">Купить</button>
        </div>
    </div>

    <div class="item-card">
        <div class="item-info">
            <span class="item-name">Brawl Pass</span>
            <span class="item-sub">Plus Сезон</span>
        </div>
        <div style="display: flex; align-items: center;">
            <span class="price">650₽</span>
            <button class="buy-btn" onclick="sendData('Brawl Pass')">Купить</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const webapp = window.Telegram.WebApp;
        webapp.expand(); // Развернуть на весь экран
        webapp.ready();

        // Функция отправки данных боту при клике на "Купить"
        function sendData(item) {
            webapp.sendData(item);
        }
    </script>
</body>
</html>

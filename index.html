<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISTSHOP - Гемы здесь!</title>
    <style>
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-top: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            box-shadow: 0 0 20px #00d2ff;
        }
        .shop-title {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price {
            color: #00ff88;
            font-weight: bold;
        }
        .buy-btn {
            background: #00d2ff;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://via.placeholder.com/120" alt="Logo" class="logo">
        <div class="shop-title">MISTSHOP</div>
    </div>

    <div class="item-card">
        <span>30 Гемов</span>
        <span class="price">199₽</span>
        <button class="buy-btn">Купить</button>
    </div>

    <div class="item-card">
        <span>170 Гемов</span>
        <span class="price">990₽</span>
        <button class="buy-btn">Купить</button>
    </div>

    <div class="item-card">
        <span>Brawl Pass</span>
        <span class="price">650₽</span>
        <button class="buy-btn">Купить</button>
    </div>

</body>
</html>
